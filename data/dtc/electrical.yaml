# Питание, связь, шасси. Здесь же — коды, которые нельзя стирать вслепую.

meta:
  version: 0.2
  scope: "электрика, сеть, шасси"

codes:
  P0562:
    title: "Низкое напряжение бортовой сети"
    systems: [питание, электрика]
    meaning: >
      Напряжение просело ниже порога, при котором ЭБУ считает работу
      электроники надёжной. Часто тянет за собой пачку кодов по другим блокам.
    symptoms:
      - тяжёлый пуск, особенно на морозе
      - ошибки по ABS, SRS, усилителю руля одновременно
    monitor_hint: "PID 42 (напряжение модуля) при пуске ниже 11,5 В."
    causes:
      - title: "Старый или разряженный АКБ"
        weight: high
        part: "аккумулятор"
        check: "Замерить напряжение под нагрузкой и ток утечки."
      - title: "Плохой контакт массы или клемм"
        weight: medium
        check: "Протяжка клемм, проверка падения напряжения на массах."
      - title: "Неисправный генератор или регулятор"
        weight: medium
        check: "Напряжение на ХХ и под нагрузкой, проверка диодного моста."
    notes:
      - >
        Это самая частая причина «пачки ошибок на ровном месте». Прежде чем
        стирать что-либо, проверьте АКБ и напряжение при пуске.

  U0100:
    title: "Потеря связи с блоком управления двигателем"
    systems: [can-шина, связь]
    meaning: >
      Другой блок не получил ответ от ЭБУ двигателя в отведённое время.
      Может быть как реальным обрывом, так и разовой помехой на шине.
    causes:
      - title: "Разовая помеха или просадка питания"
        weight: high
        check: "Посмотреть журнал: если код был один раз и не повторяется — наблюдать."
      - title: "Плохой контакт в разъёме ЭБУ"
        weight: medium
        check: "Осмотреть разъёмы, проверить окисление и посадку пинов."
      - title: "Проблема с CAN-шиной или питанием блока"
        weight: medium
        check: "Проверить сопротивление шины 60 Ом, питание и массу блока."
    notes:
      - >
        Одиночный U0100 без сопутствующих симптомов — чаще помеха, чем поломка.
        Здесь стирание оправдано, но журнал должен остаться.

  U0101:
    title: "Потеря связи с блоком управления коробкой"
    systems: [can-шина, трансмиссия]
    meaning: >
      ЭБУ двигателя не получает данные от блока АКПП: коробка может перейти
      в аварийный режим.
    symptoms: [аварийный режим АКПП, рывки, чек, иногда не переключает передачи]
    causes:
      - title: "Проблема питания или массы блока АКПП"
        weight: high
        check: "Проверить питание и массу TCM под нагрузкой."
      - title: "Обрыв или замыкание CAN-линии"
        weight: high
        check: "Сопротивление шины, осциллограмма CAN."
      - title: "Неисправный блок TCM"
        weight: medium
        check: "Только после проверки питания и шины."
    notes:
      - >
        Часто идёт вместе с P0700. Читать оба блока, а не только моторный.

  U0121:
    title: "Потеря связи с блоком ABS"
    systems: [can-шина, тормоза]
    meaning: >
      Нет связи с блоком ABS: система стабилизации и ABS могут быть
      недоступны.
    symptoms: [лампы ABS и ESP, отказ стабилизации]
    causes:
      - title: "Питание или масса блока ABS"
        weight: high
        check: "Проверить питание и массу под нагрузкой."
      - title: "CAN-шина или разъём блока"
        weight: high
        check: "Сопротивление шины, осмотреть разъём на окисление."
      - title: "Неисправный блок ABS"
        weight: medium
        check: "После исключения питания и проводки."
    notes:
      - >
        Это система безопасности. Стирание кода без устранения причины
        оставляет машину без ABS и ESP.

  C0035:
    title: "Датчик скорости переднего левого колеса: цепь"
    systems: [ABS, шасси, безопасность]
    safety_critical: true
    meaning: >
      Блок ABS не видит достоверного сигнала от датчика скорости переднего
      левого колеса.
    symptoms: [лампы ABS и ESP, отказ стабилизации, ошибка на приборке]
    monitor_hint: "Скорости колёс в live-данных: одно колесо выпадает или скачет."
    causes:
      - title: "Загрязнение или стружка на датчике"
        weight: high
        check: "Снять датчик, очистить посадочное место и задающий диск."
      - title: "Повреждённая проводка или разъём"
        weight: high
        check: "Прозвонить цепь, проверить жгут у колеса на перетирание."
      - title: "Неисправный датчик или ступица"
        weight: medium
        check: "Осциллограмма сигнала при вращении колеса."
    notes:
      - >
        Система безопасности: не стирать «чтобы не горело». Без рабочего
        датчика ABS и ESP могут не сработать в нужный момент.
