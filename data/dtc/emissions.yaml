# Экология: кислородные датчики, катализатор, вентиляция бака.
# Именно эти коды чаще всего «горят просто так» после замены деталей.

meta:
  version: 0.2
  scope: "экология и выпуск"

codes:
  P0031:
    title: "Подогрев датчика кислорода, банк 1, датчик 1: низкий сигнал"
    systems: [выпуск, электрика]
    meaning: >
      Цепь подогрева передней лямбды не выходит на рабочий ток: обрыв,
      замыкание или сгоревший нагреватель.
    symptoms: [долгий переход в замкнутый контур, повышенный расход, чек]
    monitor_hint: "Сопротивление нагревателя и ток прогрева; датчик не выходит на режим за отведённое время."
    causes:
      - title: "Сгоревший нагреватель датчика"
        weight: high
        part: "кислородный датчик"
        check: "Измерить сопротивление нагревателя и сравнить с эталоном."
      - title: "Обрыв или замыкание проводки, предохранитель"
        weight: high
        check: "Проверить цепь под нагрузкой, а не тестером без тока."
      - title: "Неоригинальный датчик с другим нагревателем"
        weight: medium
        check: "Сверить номер и характеристику с оригиналом."
    notes:
      - >
        После замены лямбды на дешёвый аналог код часто возвращается: нагреватель
        имеет другое сопротивление. Это не ложная ошибка.

  P0135:
    title: "Подогрев датчика кислорода, банк 1, датчик 1: цепь"
    systems: [выпуск, электрика]
    meaning: "ЭБУ не видит ожидаемого тока через нагреватель передней лямбды."
    causes:
      - title: "Неисправный нагреватель датчика"
        weight: high
        check: "Сопротивление и ток прогрева."
      - title: "Проводка, разъём или предохранитель"
        weight: high
        check: "Прозвонить цепь под нагрузкой."
    notes:
      - "P0031 и P0135 часто идут вместе и лечатся одинаково."

  P0401:
    title: "Недостаточный поток EGR"
    systems: [двигатель, экология]
    meaning: >
      Система рециркуляции отработавших газов не обеспечивает ожидаемый поток:
      канал забит или клапан не открывается.
    symptoms: [чек, иногда повышенная температура сгорания и детонация]
    causes:
      - title: "Забитый канал или клапан EGR"
        weight: high
        part: "клапан EGR, каналы"
        check: "Снять и осмотреть на нагар, проверить ход клапана."
      - title: "Неисправный датчик дифференциального давления"
        weight: medium
        check: "Сравнить показания с эталоном."
      - title: "Подсос или утечка в вакуумных линиях"
        weight: medium
        check: "Проверить герметичность линий управления."
    notes:
      - >
        Нагар в EGR — типичная проблема коротких поездок и плохого топлива.
        Чистка помогает чаще, чем замена.

  P0403:
    title: "Цепь клапана EGR"
    systems: [двигатель, электрика, экология]
    meaning: "Электрическая цепь клапана EGR разомкнута или замкнута."
    causes:
      - title: "Обрыв или замыкание обмотки клапана"
        weight: high
        check: "Сопротивление и управляющий сигнал."
      - title: "Проводка или разъём"
        weight: high
        check: "Прозвонить цепь под нагрузкой."
    notes:
      - "Сначала электрика, потом механическая чистка."

  P0420:
    title: "Низкая эффективность катализатора, банк 1"
    systems: [выпуск, экология]
    meaning: >
      ЭБУ сравнивает сигналы двух датчиков кислорода до и после катализатора
      и видит, что катализатор почти не сглаживает колебания.
    symptoms:
      - обычно никаких, кроме лампы
      - при сильном разрушении — запах, потеря мощности
    monitor_hint: >
      График заднего датчика кислорода почти повторяет передний — катализатор
      не работает.
    causes:
      - title: "Катализатор действительно выработал ресурс"
        weight: high
        part: "каталитический нейтрализатор"
        check: "Снять графики датчиков до/после, проверить противодавление."
      - title: "Неоригинальный катализатор с меньшим содержанием металлов"
        weight: high
        part: "катализатор"
        check: >
          После замены на дешёвый аналог код возвращается через 2–3 цикла.
          Это не ложная ошибка: деталь физически не проходит монитор.
      - title: "Неисправный задний датчик кислорода"
        weight: medium
        check: "Проверить отклик датчика и его опорное напряжение."
    notes:
      - >
        Стирание даёт ровно один цикл тишины. Если деталь неоригинальная и
        не проходит монитор — честный путь один: подбор совместимой детали
        или программное отключение монитора (это уже зона законодательства).

  P0442:
    title: "Малая утечка в системе улавливания паров топлива"
    systems: [экология, топливо]
    meaning: >
      Монитор EVAP нашёл небольшую негерметичность: система не держит
      разрежение, но утечка маленькая.
    causes:
      - title: "Неплотно закрытая крышка бензобака"
        weight: high
        part: "крышка бака"
        check: "Закрыть до щелчка, проехать 2–3 цикла, перечитать."
      - title: "Трещина в шланге или соединении"
        weight: high
        check: "Дымогенератор по системе EVAP."
      - title: "Негерметичный клапан продувки или адсорбер"
        weight: medium
        check: "Проверить герметичность и управление клапаном."
    notes:
      - >
        Самая частая причина — крышка бака. Прежде чем менять детали,
        попросите владельца закрыть её до щелчка и проехать пару циклов.

  P0443:
    title: "Цепь клапана продувки адсорбера"
    systems: [экология, электрика]
    meaning: "Электрическая цепь клапана продувки разомкнута или замкнута."
    causes:
      - title: "Обрыв или замыкание обмотки клапана"
        weight: high
        check: "Сопротивление и управляющий сигнал."
      - title: "Проводка или разъём"
        weight: high
        check: "Прозвонить цепь под нагрузкой."
    notes:
      - >
        Залипший открытый клапан даёт богатую смесь на холостом ходу и может
        тянуть P0172.

  P0455:
    title: "Большая утечка в системе улавливания паров топлива"
    systems: [экология, топливо]
    meaning: >
      Монитор EVAP не смог создать разрежение в баке: система негерметична
      или не держит давление.
    causes:
      - title: "Неплотно закрыта крышка бензобака"
        weight: high
        check: "Закрыть до щелчка, проехать 2–3 цикла, перечитать."
      - title: "Трещина в шланге или адсорбере"
        weight: medium
        check: "Визуально и дымогенератором по системе EVAP."
      - title: "Неисправный клапан продувки"
        weight: medium
        check: "Проверить управление и герметичность клапана."
    notes:
      - >
        В демо-сценарии этот код помечен как permanent: сканер его не сотрёт,
        даже если неисправность устранена. Нужно дать монитору пройти
        несколько циклов подряд.
