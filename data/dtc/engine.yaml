# Двигатель: смесь, зажигание, газораспределение, наддув.
# weight: high | medium | low — насколько часто причина даёт этот код.

meta:
  version: 0.2
  scope: "двигатель"

codes:
  P0010:
    title: "Цепь привода фазовращателя, банк 1"
    systems: [двигатель, газораспределение]
    meaning: >
      ЭБУ не видит ожидаемого отклика от клапана управления фазой: обрыв,
      замыкание или сопротивление вне допуска.
    symptoms: [неровный холостой ход, провал на низких оборотах, чек]
    monitor_hint: "Сравнить заданный и фактический угол фазовращателя, измерить сопротивление клапана."
    causes:
      - title: "Обрыв или замыкание в клапане VVT"
        weight: high
        part: "клапан фазовращателя"
        check: "Измерить сопротивление обмотки и сравнить с эталоном, проверить реакцию на 12 В."
      - title: "Окисленный разъём или повреждённая проводка"
        weight: high
        check: "Прозвонить цепь от ЭБУ до клапана под нагрузкой, а не только тестером."
      - title: "Забитая сетка или грязное масло"
        weight: medium
        check: "Снять клапан, осмотреть сетку и состояние масла."
    notes:
      - >
        Часто идёт в паре с P0011. Сначала проверяют масло и сетку, потом меняют
        клапан: иначе новый забьётся так же быстро.

  P0011:
    title: "Фазовращатель перекручен вперёд, банк 1"
    systems: [двигатель, газораспределение]
    meaning: >
      Фактический угол распредвала опережает заданный сильнее допустимого.
      ЭБУ не может удержать фазу.
    symptoms: [треск на холодном пуске, потеря тяги на низах, повышенный расход]
    monitor_hint: "Заданный и фактический угол VVT в live-данных; расхождение больше нескольких градусов."
    causes:
      - title: "Забитая сетка или канал фазовращателя"
        weight: high
        part: "сетка клапана VVT"
        check: "Снять клапан, проверить сетку и каналы на шлам."
      - title: "Растянутая цепь ГРМ"
        weight: high
        part: "цепь, натяжитель"
        check: "Проверить метки и ход натяжителя, сравнить с допуском."
      - title: "Неисправный клапан VVT"
        weight: medium
        check: "Проверить ход штока и чистоту клапана, при необходимости заменить."
    notes:
      - >
        Треск на холодную плюс P0011 — классика растянутой цепи. Стирание
        ошибки ничего не меняет, фазы остаются сбитыми.

  P0016:
    title: "Рассинхрон коленвала и распредвала, банк 1"
    systems: [двигатель, газораспределение]
    meaning: >
      ЭБУ сравнивает сигналы датчиков коленвала и распредвала и видит, что
      фазы ушли относительно расчётных.
    symptoms: [плохой запуск, потеря мощности, чек, иногда аварийный режим]
    monitor_hint: "Угол рассинхронизации в live-данных; проверить метки ГРМ механически."
    causes:
      - title: "Растянутая цепь или ремень ГРМ"
        weight: high
        part: "цепь, ремень, натяжитель"
        check: "Проверить метки и износ, а не только ошибку сканером."
      - title: "Ошибка на зуб после замены ГРМ"
        weight: high
        check: "Перепроверить установку меток по мануалу именно этого двигателя."
      - title: "Неисправный датчик распредвала или коленвала"
        weight: medium
        check: "Осциллограмма сигналов, проверка зазора и загрязнения задающего диска."
    notes:
      - >
        Один из самых частых кодов после замены цепи на современных моторах,
        включая китайские. Стирание не помогает: механика уже сбита.

  P0017:
    title: "Рассинхрон коленвала и распредвала, банк 1, датчик B"
    systems: [двигатель, газораспределение]
    meaning: >
      То же, что P0016, но по второму распредвалу (обычно выпускному).
    causes:
      - title: "Растянутая цепь или ремень ГРМ"
        weight: high
        check: "Метки, натяжитель, износ цепи."
      - title: "Неисправный датчик или его проводка"
        weight: medium
        check: "Осциллограмма и проверка разъёма."
    notes:
      - "Лечится вместе с P0016, а не отдельно."

  P0101:
    title: "ДМРВ: диапазон и производительность"
    systems: [двигатель, впуск]
    meaning: >
      Показания датчика расхода воздуха не соответствуют ожидаемым для текущего
      режима работы двигателя.
    symptoms: [провал при разгоне, плавающие обороты, повышенный расход]
    monitor_hint: "MAF на холостом ходу и под нагрузкой против эталона; смотреть вместе с коррекциями топлива."
    causes:
      - title: "Загрязнённый ДМРВ"
        weight: high
        part: "датчик массового расхода воздуха"
        check: "Аккуратно очистить специальным составом, не трогая чувствительный элемент."
      - title: "Подсос воздуха после ДМРВ"
        weight: high
        check: "Дымогенератор или опрыскивание впуска на холостом ходу."
      - title: "Неоригинальный датчик с другой характеристикой"
        weight: medium
        part: "ДМРВ"
        check: "Сверить номер и кривую с оригиналом; после замены код часто возвращается."
      - title: "Забитый воздушный фильтр"
        weight: medium
        check: "Осмотреть фильтр, при сомнении заменить."
    notes:
      - >
        Если код появился ровно после замены ДМРВ на аналог — это не ложная
        ошибка, а несовпадение характеристики. Стирание бесполезно.

  P0102:
    title: "ДМРВ: низкий уровень сигнала"
    systems: [двигатель, впуск, электрика]
    meaning: >
      Сигнал датчика ниже допустимого: обрыв, замыкание на массу или
      неисправный датчик.
    causes:
      - title: "Обрыв или замыкание в проводке"
        weight: high
        check: "Прозвонить цепь и проверить питание датчика."
      - title: "Окисленный разъём"
        weight: high
        check: "Осмотреть пины, почистить, проверить посадку."
      - title: "Неисправный ДМРВ"
        weight: medium
        check: "Сравнить сигнал с эталоном, проверить реакцию на изменение потока."
    notes:
      - "Сначала проводка, потом датчик: так дешевле и чаще угадывается."

  P0113:
    title: "Датчик температуры воздуха: высокий уровень сигнала"
    systems: [двигатель, впуск, электрика]
    meaning: >
      ЭБУ видит обрыв в цепи датчика температуры впускного воздуха и подставляет
      аварийное значение.
    symptoms: [повышенный расход, неверный состав смеси на холодную]
    causes:
      - title: "Обрыв датчика или проводки"
        weight: high
        check: "Измерить сопротивление датчика при известной температуре."
      - title: "Окисленный разъём"
        weight: medium
        check: "Осмотреть и почистить контакты."
    notes:
      - >
        Сам по себе почти не влияет на езду, но искажает расчёт смеси и может
        тянуть за собой другие коды.

  P0121:
    title: "Датчик положения дросселя: диапазон"
    systems: [двигатель, впуск]
    meaning: >
      Показания дросселя не согласуются с ожидаемыми: загрязнение, износ
      дорожек или сбитая адаптация.
    causes:
      - title: "Загрязнённый дроссель"
        weight: high
        part: "дроссельный узел"
        check: "Очистить и выполнить адаптацию дросселя."
      - title: "Сбитая адаптация после замены или снятия АКБ"
        weight: high
        check: "Выполнить процедуру обучения дросселя."
      - title: "Износ датчика или проводка"
        weight: medium
        check: "Проверить плавность сигнала при открытии дросселя."
    notes:
      - "После чистки дросселя адаптация обязательна, иначе код вернётся."

  P0128:
    title: "Термостат: двигатель не прогревается до рабочей температуры"
    systems: [двигатель, охлаждение]
    meaning: >
      ЭБУ не дождался выхода на рабочую температуру за отведённое время.
    symptoms: [печка греет слабо, расход выше, стрелка температуры ниже нормы]
    monitor_hint: "Температура ОЖ (PID 05) не поднимается выше порога за поездку."
    causes:
      - title: "Заклинивший термостат"
        weight: high
        part: "термостат"
        check: "Проверить нагрев патрубков и фактическую температуру."
      - title: "Неисправный датчик температуры ОЖ"
        weight: medium
        check: "Сравнить показания с инфракрасным термометром."
      - title: "Короткие поездки зимой"
        weight: medium
        check: "Оценить, успевает ли двигатель прогреться в реальном режиме."
    notes:
      - >
        Зимой на коротких поездках код может быть следствием режима, а не поломки.
        Но если двигатель не греется и на трассе — почти всегда термостат.

  P0171:
    title: "Бедная смесь, банк 1"
    systems: [двигатель, впуск, топливо]
    meaning: >
      ЭБУ считает, что в смеси слишком много воздуха или слишком мало топлива:
      коррекции ушли в плюс, а вытянуть состав не получается.
    symptoms:
      - плавающие обороты на холостом ходу
      - провал при разгоне
      - повышенный расход
    monitor_hint: >
      Долгосрочная коррекция топлива (PID 07) выше +15%, краткосрочная (PID 06)
      тоже в плюсе. MAF (PID 10) ниже нормы на холостом ходу.
    causes:
      - title: "Подсос воздуха во впуске"
        weight: high
        part: "прокладки, шланги, впускной коллектор"
        check: >
          Дымогенератор или аккуратно опрыскать впуск очистителем на холостом
          ходу: если обороты кратко меняются — есть подсос.
      - title: "Загрязнённый или неисправный ДМРВ"
        weight: high
        part: "датчик массового расхода воздуха"
        check: >
          Сравнить показания MAF на холостом ходу с эталоном для этого двигателя;
          проверить реакцию на резкое открытие дросселя.
      - title: "Слабый топливный насос или забитый фильтр"
        weight: medium
        part: "насос, топливный фильтр"
        check: "Замерить давление топлива под нагрузкой, а не только на холостом."
      - title: "Неоригинальный датчик с другой характеристикой"
        weight: medium
        part: "любой датчик в цепи впуска"
        check: >
          Сверить номер и кривую с оригиналом. После замены детали код часто
          возвращается, даже если деталь «рабочая».
    notes:
      - >
        Если код повторяется только на холодную при отрицательной температуре —
        это почти всегда реальный подсос, а не баг прошивки. Стирание не поможет.
      - >
        Проверять коррекции нужно вместе с кодом: сам по себе P0171 почти ничего
        не говорит о том, где искать.

  P0172:
    title: "Богатая смесь, банк 1"
    systems: [двигатель, впуск, топливо]
    meaning: >
      Коррекции ушли в минус: топлива больше, чем нужно, и ЭБУ не может
      уменьшить подачу в пределах допустимого.
    symptoms: [чёрный дым, запах бензина, повышенный расход, свечи в нагаре]
    monitor_hint: "Долгосрочная коррекция (PID 07) ниже −15%."
    causes:
      - title: "Льющие форсунки"
        weight: high
        part: "форсунки"
        check: "Стенд или проверка баланса форсунок."
      - title: "Повышенное давление топлива"
        weight: medium
        check: "Замерить давление и сравнить с допуском."
      - title: "Забитый воздушный фильтр или неисправный ДМРВ"
        weight: medium
        check: "Проверить фильтр и показания ДМРВ."
      - title: "Залипающий клапан продувки адсорбера"
        weight: medium
        part: "клапан EVAP"
        check: "Проверить герметичность и управление клапаном."
    notes:
      - "Богатая смесь опаснее бедной: разжижает масло и убивает катализатор."

  P0174:
    title: "Бедная смесь, банк 2"
    systems: [двигатель, впуск, топливо]
    meaning: "То же, что P0171, но для второго ряда цилиндров."
    monitor_hint: "Коррекции банка 2 (PID 08/09)."
    causes:
      - title: "Подсос во впуске банка 2"
        weight: high
        check: "Дымогенератор по стороне второго банка."
      - title: "ДМРВ или общая топливная система"
        weight: medium
        check: "Если P0171 и P0174 вместе — искать общую причину, а не два подсоса."
    notes:
      - >
        P0171 и P0174 одновременно почти всегда означают общую проблему:
        ДМРВ, давление топлива или большой подсос после датчика.

  P0201:
    title: "Цепь форсунки, цилиндр 1"
    systems: [двигатель, топливо, электрика]
    meaning: >
      ЭБУ не видит ожидаемого электрического отклика форсунки первого цилиндра.
    symptoms: [троение, потеря мощности, запах топлива]
    causes:
      - title: "Обрыв или замыкание обмотки форсунки"
        weight: high
        part: "форсунка"
        check: "Измерить сопротивление и сравнить с остальными."
      - title: "Повреждённая проводка или разъём"
        weight: high
        check: "Прозвонить цепь под нагрузкой, проверить посадку разъёма."
      - title: "Неисправный драйвер в ЭБУ"
        weight: low
        check: "Проверять только после исключения проводки и форсунки."
    notes:
      - "Менять форсунку местами полезно: код должен переехать вместе с ней."

  P0299:
    title: "Недостаточный наддув турбины"
    systems: [двигатель, наддув]
    meaning: >
      Фактическое давление наддува ниже заданного дольше допустимого.
    symptoms: [потеря тяги, «не едет» после 2000 об/мин, чек, аварийный режим]
    monitor_hint: "Заданное и фактическое давление наддува в live-данных, разница под нагрузкой."
    causes:
      - title: "Утечка в тракте наддува"
        weight: high
        part: "патрубки, интеркулер, прокладки"
        check: "Опрессовка тракта дымом или давлением."
      - title: "Заклинивший вестгейт или actuator"
        weight: high
        part: "вестгейт, вакуумный/электрический актуатор"
        check: "Проверить ход штока и управление."
      - title: "Неисправный датчик давления наддува"
        weight: medium
        check: "Сравнить показания с механическим манометром."
      - title: "Забитый катализатор или сажевый фильтр"
        weight: medium
        check: "Проверить противодавление на выпуске."
    notes:
      - >
        На китайских турбомоторах частая причина — треснувший пластиковый патрубок
        или закисший актуатор, а не сама турбина. Не менять турбину до опрессовки.

  P0300:
    title: "Случайные пропуски зажигания"
    systems: [двигатель, зажигание, топливо]
    meaning: >
      ЭБУ фиксирует пропуски, но не может привязать их к конкретному цилиндру.
    symptoms: [троение, вибрация, мигающий чек, потеря мощности]
    monitor_hint: "Счётчики пропусков по цилиндрам в live-данных, коррекции топлива."
    causes:
      - title: "Свечи или катушки"
        weight: high
        part: "свечи, катушки"
        check: "Осмотреть свечи, поменять катушки местами и посмотреть, переедет ли пропуск."
      - title: "Подсос воздуха или бедная смесь"
        weight: high
        check: "Проверить коррекции и герметичность впуска."
      - title: "Низкая компрессия или проблема с клапанами"
        weight: medium
        check: "Замер компрессии и пневмотест."
      - title: "Форсунки"
        weight: medium
        check: "Проверить баланс и распыл."
    notes:
      - >
        Мигающий чек при пропусках — не «просто ошибка»: несгоревшее топливо
        убивает катализатор за считанные километры. Ехать так нельзя.

  P0301:
    title: "Пропуски зажигания, цилиндр 1"
    systems: [двигатель, зажигание]
    meaning: "Пропуски локализованы в первом цилиндре."
    causes:
      - title: "Свеча или катушка цилиндра 1"
        weight: high
        check: "Поменять местами с соседним цилиндром и перечитать."
      - title: "Форсунка цилиндра 1"
        weight: medium
        check: "Проверить баланс форсунок."
      - title: "Компрессия в цилиндре"
        weight: medium
        check: "Замер компрессии, пневмотест."
    notes:
      - "Если код переехал вместе с катушкой — виновата катушка, а не цилиндр."

  P0335:
    title: "Датчик положения коленвала: цепь"
    systems: [двигатель, электрика]
    meaning: >
      Нет достоверного сигнала от датчика коленвала: двигатель может не
      запуститься или заглохнуть.
    symptoms: [не запускается, глохнет, нет искры и впрыска]
    causes:
      - title: "Неисправный датчик"
        weight: high
        part: "датчик коленвала"
        check: "Осциллограмма сигнала, сопротивление."
      - title: "Проводка или разъём"
        weight: high
        check: "Прозвонить цепь, проверить экран и посадку."
      - title: "Загрязнение или повреждение задающего диска"
        weight: medium
        check: "Осмотреть зубчатый диск и зазор."
    notes:
      - "При этом коде машина может не заводиться вообще — это не «плавающая мелочь»."

  P0340:
    title: "Датчик распредвала: цепь"
    systems: [двигатель, электрика]
    meaning: >
      ЭБУ не получает достоверный сигнал от датчика распредвала и переходит
      на аварийный режим.
    symptoms: [плохой запуск, потеря мощности, аварийный режим]
    causes:
      - title: "Неисправный датчик"
        weight: high
        check: "Осциллограмма и проверка питания."
      - title: "Проводка или разъём"
        weight: high
        check: "Прозвонить цепь под нагрузкой."
      - title: "Металлическая стружка на датчике"
        weight: medium
        check: "Осмотреть и очистить."
    notes:
      - >
        Не путать с P0016: там сигналы есть, но фазы сбиты. Здесь сигнала нет.

  P0505:
    title: "Система управления холостым ходом"
    systems: [двигатель, впуск]
    meaning: >
      ЭБУ не может удержать заданные обороты холостого хода.
    symptoms: [плавающие обороты, глохнет на светофоре, повышенный ХХ]
    causes:
      - title: "Загрязнённый дроссель"
        weight: high
        check: "Очистить и адаптировать."
      - title: "Подсос воздуха"
        weight: high
        check: "Дымогенератор."
      - title: "Неисправный регулятор ХХ или его цепь"
        weight: medium
        check: "Проверить ход и управление."
    notes:
      - "После любой чистки дросселя нужна адаптация, иначе код вернётся."

  P0507:
    title: "Обороты холостого хода выше нормы"
    systems: [двигатель, впуск]
    meaning: "Фактические обороты ХХ выше заданных больше допустимого."
    causes:
      - title: "Подсос воздуха"
        weight: high
        check: "Дымогенератор, герметичность впуска."
      - title: "Загрязнённый дроссель или сбитая адаптация"
        weight: high
        check: "Чистка и адаптация."
      - title: "Неисправный клапан вентиляции картера"
        weight: medium
        check: "Проверить мембрану и герметичность."
    notes:
      - "Высокие обороты на ХХ — почти всегда лишний воздух, а не «мозги»."

  P0606:
    title: "Внутренняя ошибка процессора ЭБУ"
    systems: [двигатель, электроника]
    meaning: >
      Самодиагностика блока управления зафиксировала сбой внутренних цепей.
      Это может быть как реальный отказ, так и следствие просадки питания.
    symptoms: [аварийный режим, нестабильная работа, отказ запуска]
    causes:
      - title: "Просадка питания или плохая масса ЭБУ"
        weight: high
        check: "Проверить питание и массы блока под нагрузкой."
      - title: "Последствия прикуривания или скачка напряжения"
        weight: high
        check: "Стереть, проверить, не возвращается ли после стабильного питания."
      - title: "Реальный отказ ЭБУ"
        weight: medium
        check: "Только после исключения питания и проводки."
    notes:
      - >
        Не спешить менять блок: на многих машинах P0606 — следствие слабого АКБ
        или плохой массы. Сначала питание, потом приговор.

  P0700:
    title: "Запрос неисправности от блока АКПП"
    systems: [трансмиссия, связь]
    meaning: >
      Моторный ЭБУ зажигает чек по просьбе блока управления коробкой.
      Сама неисправность описана в кодах АКПП, а не здесь.
    symptoms: [чек без кодов в двигателе, рывки, аварийный режим АКПП]
    monitor_hint: "Читать коды блока трансмиссии отдельно: в моторном будет только P0700."
    causes:
      - title: "Есть активные коды в блоке АКПП"
        weight: high
        check: "Подключиться к TCM и прочитать его коды."
      - title: "Проблема связи между ЭБУ и TCM"
        weight: medium
        check: "Проверить CAN и питание блока коробки."
      - title: "Механическая неисправность АКПП"
        weight: medium
        check: "Диагностика по кодам TCM и поведению коробки."
    notes:
      - >
        Классика «чек горит, а в двигателе пусто». Пока не прочитан TCM,
        стирать P0700 бессмысленно.

  P2187:
    title: "Бедная смесь на холостом ходу, банк 1"
    systems: [двигатель, впуск]
    meaning: >
      То же, что P0171, но ЭБУ зафиксировал отклонение именно на холостом ходу.
      Часто идёт в паре с P0171 и имеет ту же первопричину.
    monitor_hint: "Коррекции на холостом ходу, разряжение во впуске."
    causes:
      - title: "Подсос воздуха"
        weight: high
        check: "Дымогенератор, герметичность впуска после ДМРВ."
      - title: "Загрязнённый дроссель"
        weight: medium
        check: "Осмотреть и очистить, затем выполнить адаптацию дросселя."
    notes:
      - "Лечить вместе с P0171, а не по отдельности."
