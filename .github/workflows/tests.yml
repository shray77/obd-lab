name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Зависимости
        run: python -m pip install -r requirements.txt
      - name: Юнит-тесты
        run: python -m unittest discover -s tests -v

# Интеграционные тесты на ELM327-emulator скипаются сами (стенд не в CI),
# тест на справочник OBDex скипается без data/obdex.sqlite3 — он не в git
# и собирается локально: python tools/import_obdex.py
